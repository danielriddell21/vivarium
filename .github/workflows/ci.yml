name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      # Ebiten's GLFW backend needs the OpenGL/X11 development headers to build.
      - name: Install graphics build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxxf86vm-dev libasound2-dev

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      # The headless binary needs no display, so it doubles as an end-to-end smoke
      # test of the simulation core.
      - name: Headless smoke run
        run: go run ./cmd/vivarium-headless -seed 1 -ticks 500 -every 250
