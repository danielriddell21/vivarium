version: 2

project_name: vivarium

before:
  hooks:
    - go mod tidy

builds:
  # Headless CLI: CGO-free batch simulator, cross-compiled to every desktop
  # OS/arch. Ebiten is behind the `ebiten` tag, so no display libs are needed.
  - id: headless
    main: ./cmd/vivarium-headless
    binary: vivarium-headless
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

  # GUI build: the Ebiten window compiled in via the `ebiten` tag. Needs cgo
  # (Metal / Cocoa), so it is macOS-only and built natively on the macOS runner.
  - id: gui
    main: ./cmd/vivarium
    binary: vivarium
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=ebiten
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: headless
    ids: [headless]
    name_template: "{{ .ProjectName }}-headless_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: gui
    ids: [gui]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  name_template: "v{{ .Version }}"

# Homebrew formula: the cross-platform headless batch runner.
brews:
  - name: vivarium-headless
    ids: [headless]
    repository:
      owner: danielriddell21
      name: homebrew-tap
      branch: trunk
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/danielriddell21/vivarium
    description: "Headless batch runner for the Vivarium ecosystem simulation"
    license: MIT
    commit_msg_template: "Brew formula update for vivarium-headless {{ .Tag }}"
    install: |
      bin.install "vivarium-headless"

# Homebrew cask: the macOS-only native Ebiten window.
homebrew_casks:
  - name: vivarium
    ids: [gui]
    repository:
      owner: danielriddell21
      name: homebrew-tap
      branch: trunk
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/danielriddell21/vivarium
    description: "Watch an evolving 2D ecosystem in a native macOS window"
    license: MIT
    caveats: "The vivarium window is macOS-only; on Linux/Windows install the vivarium-headless formula for batch runs."
